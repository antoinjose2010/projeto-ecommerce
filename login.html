<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HouseShop | Login</title>

    <script src="https://cdn.tailwindcss.com"></script>

  
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="h-screen overflow-hidden bg-gray-100 flex items-center justify-center p-3">


    <div class="w-full max-w-5xl h-[95vh] bg-white rounded-3xl shadow-2xl overflow-hidden grid grid-cols-1 lg:grid-cols-2">

    
        <div class="bg-gradient-to-br from-indigo-600 to-purple-700 p-8 lg:p-12 flex flex-col justify-center text-white relative overflow-hidden">

         
            <div class="absolute -top-10 -right-10 w-44 h-44 bg-white/10 rounded-full"></div>
            <div class="absolute bottom-0 left-0 w-32 h-32 bg-white/10 rounded-full"></div>

           
            <h1 class="text-3xl lg:text-4xl font-extrabold relative z-10">
                <span>House</span>Shop
            </h1>

       
            <h2 class="mt-6 text-2xl lg:text-4xl font-bold leading-tight relative z-10">
                Faça login ou crie uma conta
            </h2>

            <p class="mt-4 text-sm lg:text-base text-gray-100 relative z-10">
                Aproveite ofertas especiais e acompanhe seus pedidos facilmente.
            </p>

            <!-- Ícones -->
            <div class="flex gap-4 mt-8 relative z-10">

                <div class="w-12 h-12 rounded-2xl bg-white/20 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-bag-shopping"></i>
                </div>

                <div class="w-12 h-12 rounded-2xl bg-white/20 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-truck-fast"></i>
                </div>

                <div class="w-12 h-12 rounded-2xl bg-white/20 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-tags"></i>
                </div>

            </div>

        </div>

        <div class="p-6 lg:p-10 flex items-center justify-center overflow-hidden">

            <div class="w-full max-w-sm">

       
                <h3 class="text-2xl lg:text-3xl font-bold text-gray-800">
                    Entrar
                </h3>

                <p class="text-gray-500 mt-1 text-sm">
                    Entre com sua conta para continuar.
                </p>

       
                <form class="mt-6 space-y-4">

           
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            E-mail
                        </label>

                        <div class="relative">

                            <input 
                                type="email"
                                placeholder="Digite seu e-mail"
                                class="w-full border border-gray-300 rounded-xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            >

                            <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

                        </div>
                    </div>

            
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Senha
                        </label>

                        <div class="relative">

                            <input 
                                type="password"
                                placeholder="Digite sua senha"
                                class="w-full border border-gray-300 rounded-xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            >

                            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

                        </div>
                    </div>

   
                    <div class="flex items-center justify-between text-xs lg:text-sm">

                        <label class="flex items-center gap-2 text-gray-600">
                            <input type="checkbox">
                            Lembrar de mim
                        </label>

                        <a href="#" class="text-indigo-600 hover:underline">
                            Esqueceu a senha?
                        </a>

                    </div>

              
                    <button
                        class="w-full bg-indigo-600 hover:bg-indigo-700 transition text-white font-bold py-3 rounded-xl shadow-md text-sm">
                        Entrar
                    </button>

                </form>

        
                <div class="flex items-center gap-3 my-5">

                    <div class="flex-1 h-px bg-gray-300"></div>

                    <span class="text-gray-400 text-xs">
                        ou continue com
                    </span>

                    <div class="flex-1 h-px bg-gray-300"></div>

                </div>

       
                <div class="grid grid-cols-2 gap-3">

                    <button
                        class="border border-gray-300 rounded-xl py-2.5 text-sm font-semibold hover:bg-gray-100 transition flex items-center justify-center gap-2">

                        <i class="fa-brands fa-google text-red-500"></i>
                        Google
                    </button>

                    <button
                        class="border border-gray-300 rounded-xl py-2.5 text-sm font-semibold hover:bg-gray-100 transition flex items-center justify-center gap-2">

                        <i class="fa-brands fa-facebook text-blue-600"></i>
                        Facebook
                    </button>

                </div>

                <p class="text-center text-gray-600 mt-5 text-sm">
                    Não possui conta?

                    <a href="#" class="text-indigo-600 font-semibold hover:underline">
                        Criar conta
                    </a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
